<!DOCTYPE html>
<html>
  <head>
    <title>Skyrim Assets Catalog</title>
    <link rel="stylesheet" href="https://raw.githack.com/DiegoBarMor/chocomint-css/main/chocomint.min.css">
    <link rel="stylesheet" type="text/css" href=style.css>
  </head>

  <body>
    <header class="dynamic-navbar" id="navbar">
      <nav class="chocomint-nav-container">
        <abbr title="Home DiegoBarMor"><a href="https://diegobarmor.github.io/">
            <img class="icon-neon" src="https://raw.githack.com/DiegoBarMor/chocomint-css/main/icons/home.png" alt="Icon">
          </a></abbr>
        <abbr title="Toggle BG Particles">
          <img class="icon-neon" src="https://raw.githack.com/DiegoBarMor/chocomint-css/main/icons/particles.png" alt="Icon"
            onclick="toggle_particles()">
        </abbr>
        <abbr title="Toggle Theme">
          <img class="icon-neon" src="https://raw.githack.com/DiegoBarMor/chocomint-css/main/icons/theme.png" alt="Icon"
            onclick="toggle_theme()">
        </abbr>
        <div class="chocomint-nav-buttons">
          <a class="button" href="https://diegobarmor.github.io/skyrim-assets-catalog/">Catalog</a>
          <a class="button" href="#" onclick="enable_view_detailed(false)">View: List</a>
          <a class="button" href="#" onclick="enable_view_detailed(true )">View: Detailed</a>
          <a class="button" href="https://github.com/DiegoBarMor/skyrim-assets-catalog/blob/main/data/statics.meta.csv">Full Table</a>
          <a class="button" href="https://diegobarmor.github.io/skyrim-assets-catalog/about.html">About</a>
        </div>
      </nav>
    </header>

    <main id="main">
      <div class="contents"> <h1>Skyrim Assets Catalog</h1>
        <small>Assets catalog for <a href="https://en.wikipedia.org/wiki/The_Elder_Scrolls_V:_Skyrim">TESV: Skyrim</a></small><br>
        <small><a href="https://diegobarmor.github.io/skyrim-assets-catalog/about.html">What is this?</a></small><br>
        <br>
        <div id="text_path"></div>
        <div id="list_dirs"></div>
        <div id="list_nifs"></div>
        <div id="detailed_view"></div>
      </div>

    </main>

    <div id="bg-animation-container"></div>

  </body>

  <script src="https://raw.githack.com/DiegoBarMor/chocomint-css/main/chocomint.min.js"></script>
  <script type="text/javascript" src="src/data.js"></script>
  <script type="text/javascript" src="src/view_list.js"></script>
  <script type="text/javascript" src="src/view_detailed.js"></script>
  <script type="text/javascript" src="src/main.js"></script>

</html>
